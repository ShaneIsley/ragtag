[project]
name = "ragtag"
version = "0.1.0"
description = "Policy Desk: cited answers about how AI may be used at UNSW"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# What the app needs. The ingest job adds the "ingest" group; images install only
# what they run (see Dockerfile.app and Dockerfile.ingest).
dependencies = [
    "azure-search-documents>=12.0.0",
    "boto3>=1.43.123",
    "en-core-web-sm",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "openai>=3.41.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "spacy==3.8.16",
    "uvicorn>=0.54.0",
]

[dependency-groups]
ingest = [
    "awslambdaric>=4.2.3",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "markitdown>=0.1.9",
    "pymupdf-layout==1.28.2",
    "pymupdf4llm==1.28.2",
]
dev = [
    "boto3-stubs[bedrock-runtime,secretsmanager]>=1.43.123",
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]
eval = [
    "awslambdaric>=4.2.3",
    "azure-ai-evaluation==1.18.9",
]

[tool.uv]
package = false
# Locally, `uv sync` installs everything, so tests and type checks cover both.
default-groups = ["dev", "ingest", "eval"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["app", "ingest", "evals", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
# PyMuPDF, the Azure AI Evaluation graders and Presidio ship without full type hints.
untyped_calls_exclude = ["pymupdf", "azure.ai.evaluation", "presidio_anonymizer"]

[[tool.mypy.overrides]]
module = ["app.*", "ingest.*", "evals.*"]
strict = true

[[tool.mypy.overrides]]
module = ["pymupdf4llm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
