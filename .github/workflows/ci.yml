# CI/CD. Every pull request and push: lint, types, unit and API tests, Terraform
# validation, and on pull requests the three images built and scanned. On main:
#   1. the evaluation gate, when a file that decides answers changed: the app's image
#      runs on the runner against the real Azure services, the golden set is asked,
#      and the run is recorded as a release run (about US$0.15)
#   2. deploy, if the gate passed or wasn't needed: build, scan and push the images,
#      point the functions at them, check /health, and start a post-deploy canary
# AWS access is by OIDC: no keys are stored in GitHub. The four settings it needs are
# Actions secrets, not variables, so they're masked in the logs, which are public on a
# public repository: none is a key, but they name the account, the services and the
# site (infra/README.md, CI and deployment).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests' runs are replaced by newer pushes; main's always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  UV_VERSION: "0.13.0"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      answer: ${{ steps.filter.outputs.answer }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The files evals/records.py fingerprints: a change here needs the gate. A change
          # to this workflow runs the gate and deploy too, so the pipeline is proven end to end.
          filters: |
            answer:
              - '.github/workflows/**'
              - 'app/**'
              - 'prompts/**'
              - 'search/index.json'
              - 'Dockerfile.app'
              - 'pyproject.toml'
              - 'uv.lock'
            deploy:
              - '.github/workflows/**'
              - 'app/**'
              - 'prompts/**'
              - 'search/**'
              - 'ingest/**'
              - 'evals/**'
              - 'Dockerfile.*'
              - 'pyproject.toml'
              - 'uv.lock'

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types, with the files pyproject.toml lists (the tests too)
        run: uv run mypy
      - name: Unit and API tests, with fake models
        run: uv run pytest -q

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [app, ingest, eval]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f Dockerfile.${{ matrix.image }} -t policy-desk-${{ matrix.image }}:pr .
      - name: Scan, reporting high and critical
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: policy-desk-${{ matrix.image }}:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan, failing on critical
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: policy-desk-${{ matrix.image }}:pr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gate:
    needs: [changes, checks]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.changes.outputs.answer == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Build the app's image
        run: docker build -f Dockerfile.app --build-arg APP_VERSION="${GITHUB_SHA::12}" -t policy-desk-app:candidate .
      - name: Run it, with the CI role's credentials for its keys
        run: |
          # Mask each long value too (ARNs, endpoints, the bucket), not only the whole
          # multi-line secret.
          while IFS= read -r line; do
            value=${line#*=}
            if [ ${#value} -ge 20 ]; then echo "::add-mask::$value"; fi
          done <<< "$APP_ENV"
          printf '%s\n' "$APP_ENV" > "$RUNNER_TEMP/app.env"
          # boto3 takes its region from AWS_DEFAULT_REGION; Lambda sets it, here it's passed.
          docker run -d --name app -p 127.0.0.1:8001:8000 --env-file "$RUNNER_TEMP/app.env" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION policy-desk-app:candidate
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/health && exit 0
            # Stop waiting as soon as the app has exited.
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 2
          done
          docker logs app; exit 1
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --frozen --all-groups
      - name: The evaluation gate, recorded as a release run
        run: |
          set -a; . "$RUNNER_TEMP/app.env"; set +a
          # The publish's Release-Note trailer, for the status page's releases.
          EVAL_NOTE="$(git log -1 --format='%(trailers:key=Release-Note,valueonly)')"
          export EVAL_NOTE
          make eval EVAL_KIND=release
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation
          path: evals/results/
          if-no-files-found: ignore
      - name: The app's log, if the gate failed
        if: failure()
        run: docker logs app || echo "The app didn't start."

  deploy:
    needs: [changes, checks, infra, gate]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.checks.result == 'success' && needs.infra.result == 'success' &&
      (needs.gate.result == 'success' || needs.gate.result == 'skipped') &&
      (needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    # No GitHub environment here: a job in one presents itself to AWS as that
    # environment, not as main, and the deploy role trusts main only.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: The release's tag, the commit's short SHA
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build the three images
        run: |
          for name in app ingest eval; do
            docker build -f "Dockerfile.$name" --build-arg APP_VERSION="$TAG" \
              -t "$REGISTRY/policy-desk-$name:$TAG" .
          done
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Scan the app's image, failing on critical
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/policy-desk-app:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the ingest image, failing on critical
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/policy-desk-ingest:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the eval image, failing on critical
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/policy-desk-eval:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push them; ECR's tags can't be overwritten
        run: |
          for name in app ingest eval; do
            if aws ecr describe-images --repository-name "policy-desk-$name" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "policy-desk-$name:$TAG is already in ECR."
            else
              docker push "$REGISTRY/policy-desk-$name:$TAG"
            fi
          done
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Deploy, check /health, start the post-deploy canary
        run: |
          RELEASE_NOTE="$(git log -1 --format='%(trailers:key=Release-Note,valueonly)')"
          export RELEASE_NOTE
          scripts/deploy.sh "$TAG" "$REGISTRY" "$SITE_URL"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
          SITE_URL: ${{ secrets.SITE_URL }}
