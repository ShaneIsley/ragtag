# Policy Desk sources
# The documents the app answers from: UNSW's public policies and guidance on AI.
# Licence terms were checked on 22 October 2026 (the last nine sources on
# 31 October 2026) and must be rechecked before each re-ingest. est_chunks assumes about 150 words per chunk.
# classification uses the most open level of a typical university scheme.
# sections (optional) keeps only those headings and what sits under them, for a
# source that is one part of a larger page. A bold line that is only a clause
# number and title, such as **3.2. We are accurate**, counts as a heading.
# label_column (optional) is for a PDF laid out as a two-column table: bold row
# labels left of that x position, in points, and their text to the right.

