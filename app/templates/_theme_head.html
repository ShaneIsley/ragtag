{# Applies a saved theme and colours before the page draws, so it doesn't flash. #}
<script nonce="{{ nonce }}">
(() => {
  try {
    const theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    if (localStorage.getItem("palette") === "reading") document.documentElement.dataset.palette = "reading";
  } catch (e) { /* storage blocked: follow the device, in the standard colours */ }
})();
</script>
