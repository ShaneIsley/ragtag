{# The theme and colour switches: Auto follows the device; black and white is for
   reading. Hidden without script, where they couldn't work. The choices stay in this
   browser and are sent nowhere. #}
<fieldset class="theme" id="theme" hidden>
  <legend>Theme</legend>
  <label><input type="radio" name="theme" value="auto"> Auto</label>
  <label><input type="radio" name="theme" value="light"> Light</label>
  <label><input type="radio" name="theme" value="dark"> Dark</label>
</fieldset>
<fieldset class="theme" id="palette" hidden>
  <legend>Colours</legend>
  <label><input type="radio" name="palette" value="standard"> Standard</label>
  <label><input type="radio" name="palette" value="reading"> Black and white</label>
</fieldset>
<script nonce="{{ nonce }}">
(() => {
  const root = document.documentElement;
  // Each switch: its storage key, the value that means "nothing saved", and the
  // root attribute it sets.
  for (const [key, plain, attribute] of [["theme", "auto", "theme"], ["palette", "standard", "palette"]]) {
    let saved = plain;
    try { saved = localStorage.getItem(key) || plain; } catch (e) { /* the default */ }
    for (const radio of document.querySelectorAll(`#${key} input[name="${key}"]`)) {
      radio.checked = radio.value === saved;
      radio.addEventListener("change", () => {
        try {
          if (radio.value === plain) localStorage.removeItem(key);
          else localStorage.setItem(key, radio.value);
        } catch (e) { /* the choice lasts for this page only */ }
        if (radio.value === plain) delete root.dataset[attribute];
        else root.dataset[attribute] = radio.value;
      });
    }
    document.getElementById(key).hidden = false;
  }
})();
</script>
